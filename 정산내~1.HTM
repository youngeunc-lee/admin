<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정산 내역 상세 조회 — 조회 단위 추가안</title>
<style>
  :root{
    --blue:#1677ff;
    --blue-bg:#e6f4ff;
    --border:#d9d9d9;
    --line:#f0f0f0;
    --text:#1f2937;
    --sub:#6b7280;
    --disabled-bg:#f5f5f5;
    --disabled-text:#bfbfbf;
    --head:#fafafa;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:#f0f2f5; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
    font-size:13px; line-height:1.5;
  }
  .page{padding:20px 24px 48px}
  h1{font-size:19px; font-weight:700; margin:0 0 14px}

  .card{background:#fff; border:1px solid var(--line); border-radius:4px}
  .filter{padding:18px 22px 6px}

  /* ── 조건 행 ── */
  .row{display:flex; align-items:center; gap:10px; padding:7px 0; min-height:34px; flex-wrap:wrap}
  .label{width:88px; flex:none; font-size:13px; color:var(--text)}
  .label.req::before{content:"*"; color:#ff4d4f; margin-right:3px}
  .label-inline{width:88px; flex:none}

  /* ── 조회 단위 (신규) ── */
  .mode-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 22px; background:#fbfcfe;
    border-bottom:1px solid var(--line);
  }
  .seg{display:inline-flex; border:1px solid var(--blue); border-radius:4px; overflow:hidden}
  .seg button{
    appearance:none; border:0; background:#fff; color:var(--blue);
    font-size:13px; padding:6px 18px; cursor:pointer; font-family:inherit;
  }
  .seg button + button{border-left:1px solid var(--blue)}
  .seg button[aria-pressed="true"]{background:var(--blue); color:#fff; font-weight:600}

  /* ── 컨트롤 ── */
  .btn-group{display:inline-flex; gap:6px}
  .chip{
    border:1px solid var(--border); background:#fff; border-radius:3px;
    padding:4px 13px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--text);
  }
  .chip.on{border-color:var(--blue); color:var(--blue)}

  .cbs{display:flex; gap:16px; flex-wrap:wrap; align-items:center}
  label.cb{display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer}
  input[type=checkbox]{accent-color:var(--blue); width:14px; height:14px; margin:0}

  select,input[type=text],input[type=date],input[type=month]{
    height:30px; border:1px solid var(--border); border-radius:3px; padding:0 9px;
    font-size:13px; font-family:inherit; background:#fff; color:var(--text);
  }
  .sel-w{width:400px}
  .kw{flex:1; min-width:260px; max-width:1240px}
  .datebox{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border);
    border-radius:3px; padding:3px 10px; background:#fff;
  }
  .datebox input{border:0; height:22px; padding:0; width:110px}
  .datebox .tilde{color:var(--sub)}
  .dfield{position:relative}
  .dcap{position:absolute; top:-15px; left:0; font-size:11px; color:var(--sub)}
  .quick{margin-left:auto; display:inline-flex}
  .quick button{
    border:1px solid var(--border); background:#fff; padding:5px 14px; font-size:13px;
    cursor:pointer; font-family:inherit; color:var(--text); margin-left:-1px;
  }
  .quick button:first-child{border-radius:3px 0 0 3px}
  .quick button:last-child{border-radius:0 3px 3px 0}

  /* 비활성(값 보존) */
  .disabled{opacity:.5}
  .disabled label.cb{color:var(--disabled-text); cursor:not-allowed}
  .disabled .label{color:var(--disabled-text)}

  .actions{display:flex; justify-content:center; padding:10px 0 4px}
  .collapse{background:none; border:0; color:var(--text); font-size:13px; cursor:pointer; font-family:inherit}
  .submit{display:flex; justify-content:flex-end; gap:8px; padding:6px 22px 18px}
  .primary{
    background:var(--blue); color:#fff; border:1px solid var(--blue); border-radius:3px;
    padding:7px 20px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600;
  }
  .ghost{
    background:#fff; color:var(--text); border:1px solid var(--border); border-radius:3px;
    padding:7px 18px; font-size:13px; cursor:pointer; font-family:inherit;
  }

  /* ── 조건 요약 ── */
  .summary{
    display:flex; align-items:flex-start; gap:12px; padding:12px 4px;
    font-size:12px; color:var(--sub); border-bottom:1px solid var(--line);
  }
  .summary .txt{flex:1; word-break:keep-all}
  .summary .tools{display:flex; gap:8px; flex:none}
  .tool{
    border:1px solid var(--border); background:#fff; border-radius:3px; padding:6px 12px;
    font-size:12px; cursor:pointer; font-family:inherit; color:var(--text);
  }
  .tool.accent{border-color:#52c41a; color:#389e0d}

  /* ── 그리드 ── */
  .gridwrap{background:#fff; border:1px solid var(--line); border-top:0; overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:12px; white-space:nowrap}
  th,td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 10px; text-align:left}
  th{background:var(--head); font-weight:600; color:#374151; position:sticky; top:0}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  tr:hover td{background:#fafcff}
  td.dash{color:#bfbfbf; text-align:center}
  th.pivot{background:#f6ffed}
  th.key{background:#f0f7ff}
  .empty{padding:70px 0; text-align:center; color:#9ca3af; font-size:13px; background:#fff;
         border:1px solid var(--line); border-top:0}
  .empty svg{display:block; margin:0 auto 10px}
  .gridtop{
    display:flex; align-items:center; gap:14px; padding:10px 12px;
    background:#fff; border:1px solid var(--line); border-bottom:0; font-size:12px;
  }
  .cnt{color:var(--sub)}
  .cnt b{color:var(--text)}

  .note{
    margin-top:22px; background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:16px 20px; font-size:12.5px; color:#374151; line-height:1.75;
  }
  .note h2{font-size:13px; margin:0 0 8px; color:var(--text)}
  .note p{margin:0 0 10px}
  .note p:last-child{margin-bottom:0}
  .note code{background:#f5f5f5; border-radius:3px; padding:1px 5px; font-size:11.5px}
</style>
</head>
<body>
<div class="page">
  <h1>정산 내역 상세 조회</h1>

  <div class="card">

    <!-- ══ 신규: 조회 단위 (조건 영역 최상단) ══ -->
    <div class="mode-row">
      <span class="label" style="width:88px">조회 단위</span>
      <div class="seg" id="seg">
        <button type="button" data-mode="detail" aria-pressed="true">건별 조회</button>
        <button type="button" data-mode="sum" aria-pressed="false">사업장 합산</button>
      </div>
    </div>

    <div class="filter">

      <!-- 카테고리 -->
      <div class="row">
        <span class="label">카테고리 :</span>
        <div class="btn-group">
          <button class="chip on">모텔</button>
          <button class="chip">호텔</button>
          <button class="chip">펜션</button>
          <button class="chip">게스트하우스</button>
          <button class="chip">캠핑</button>
        </div>
      </div>

      <!-- BM 유형 -->
      <div class="row">
        <span class="label req">BM 유형 :</span>
        <div class="cbs">
          <label class="cb"><input type="checkbox" checked>전체</label>
          <label class="cb"><input type="checkbox" checked>예약대행</label>
          <label class="cb"><input type="checkbox" checked>온라인총판</label>
          <label class="cb"><input type="checkbox" checked>선지급</label>
          <label class="cb"><input type="checkbox" checked>선매입</label>
          <label class="cb"><input type="checkbox" checked>무한쿠폰룸</label>
          <label class="cb"><input type="checkbox" checked>포인트룸</label>
          <label class="cb"><input type="checkbox" checked>쿠폰NO.5</label>
        </div>
      </div>

      <!-- 기간 설정 -->
      <div class="row">
        <span class="label">기간 설정 :</span>
        <select class="sel-w" id="periodType">
          <option>거래일</option>
          <option>정산예정일</option>
          <option selected>정산기준일</option>
        </select>

        <div class="datebox" id="dayRange" style="margin-left:18px">
          <div class="dfield"><span class="dcap">시작일</span><input type="date" value="2026-09-01"></div>
          <span class="tilde">~</span>
          <div class="dfield"><span class="dcap">종료일</span><input type="date" value="2026-09-17"></div>
        </div>

        <div class="quick" id="quick">
          <button>당일</button><button>이번 주</button><button>이번 달</button>
        </div>
      </div>

      <!-- 정산 주기 -->
      <div class="row" id="cycleRow">
        <span class="label req">정산 주기 :</span>
        <div class="cbs">
          <label class="cb"><input type="checkbox" checked>전체</label>
          <label class="cb"><input type="checkbox" checked>일정산</label>
          <label class="cb"><input type="checkbox" checked>주정산</label>
          <label class="cb"><input type="checkbox" checked>월정산A</label>
          <label class="cb"><input type="checkbox" checked>월정산B</label>
          <label class="cb"><input type="checkbox" checked>지정일 미확정</label>
        </div>
      </div>

      <!-- 거래 구분 -->
      <div class="row" id="txnRow">
        <span class="label req">거래 구분 :</span>
        <div class="cbs">
          <label class="cb"><input type="checkbox" checked>전체</label>
          <label class="cb"><input type="checkbox" checked>숙박</label>
          <label class="cb"><input type="checkbox" checked>취소수수료</label>
          <label class="cb"><input type="checkbox" checked>조정액</label>
          <label class="cb"><input type="checkbox" checked>업체부담쿠폰</label>
          <label class="cb"><input type="checkbox" checked>야놀자케어</label>
          <label class="cb"><input type="checkbox" checked>NOL 부스팅 서비스 이용료</label>
        </div>
      </div>

      <!-- 검색 조건 (합산에서 비활성) -->
      <div class="row" id="searchCondRow">
        <span class="label">검색 조건 :</span>
        <select class="sel-w" id="searchCond"></select>
        <input type="text" class="kw" id="searchKw" placeholder="">
      </div>

      <div class="row" id="optRow">
        <span class="label-inline"></span>
        <div class="cbs" style="padding-left:4px">
          <label class="cb"><input type="checkbox">DM톡 쿠폰만 조회</label>
          <label class="cb" style="margin-left:14px"><input type="checkbox">메타서치</label>
        </div>
      </div>

      <!-- 정산 상태 -->
      <div class="row" id="stateRow">
        <span class="label req">정산 상태 :</span>
        <div class="cbs">
          <label class="cb"><input type="checkbox" checked>전체</label>
          <label class="cb"><input type="checkbox" checked>정산대기</label>
          <label class="cb"><input type="checkbox" checked>자동보류</label>
          <label class="cb"><input type="checkbox" checked>수동보류</label>
          <label class="cb"><input type="checkbox" checked>지급요청대기</label>
          <label class="cb"><input type="checkbox" checked>지급요청중</label>
          <label class="cb"><input type="checkbox" checked>정산완료</label>
        </div>
      </div>

      <div class="actions">
        <button class="collapse">∧ 검색 영역 닫기</button>
      </div>
    </div>

    <div class="submit">
      <button class="primary" id="searchBtn">🔍 검색하기</button>
      <button class="ghost" id="resetBtn">↺ 초기화</button>
    </div>
  </div>

  <!-- 조건 요약 -->
  <div class="summary">
    <div class="txt" id="summaryTxt"></div>
    <div class="tools">
      <button class="tool">⚙ 컬럼 표시 설정</button>
      <button class="tool accent" id="xlsBtn">엑셀 다운로드</button>
    </div>
  </div>

  <!-- 그리드 상단 옵션 -->
  <div class="gridtop" id="gridTop" style="display:none">
    <span class="cnt">조회 결과 <b id="rowCnt">0</b>건</span>
  </div>

  <div class="gridwrap" id="gridWrap" style="display:none">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="empty" id="emptyBox">
    <svg width="54" height="40" viewBox="0 0 54 40" fill="none">
      <path d="M4 24h12l3 5h16l3-5h12v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V24Z" stroke="#d9d9d9" stroke-width="1.6" fill="#fafafa"/>
      <path d="M11 24 16 7h22l5 17" stroke="#d9d9d9" stroke-width="1.6" fill="#fff"/>
    </svg>
    <span id="emptyMsg">조건을 설정한 후 검색하기를 눌러주세요.</span>
  </div>

  <!-- 구현 메모 (필요 시 이 주석을 해제해 다시 노출)
  <div class="note">
    <h2>구현 메모</h2>
    <p><b>조회 단위는 조건 영역 최상단.</b> 결과의 형태를 결정하는 상위 조건이므로 사용자가 조건을 채우기 전에 먼저 마주치도록 배치합니다. 기본값은 <code>건별 조회</code>로 두어 기존 플로우를 유지합니다.</p>
    <p><b>검색 조건 항목만 조회 단위에 따라 다름.</b> 건별은 파트너ID·파트너명·사업장ID·사업자명·통합예약번호·예약번호, 합산은 예약 단위 항목을 뺀 파트너ID·파트너명·사업장ID·사업자명입니다. 기간·BM유형·정산주기·거래구분·정산상태 등 나머지 조건은 모드와 무관하게 동일하게 유지됩니다. 모드를 바꿀 때 선택값은 그대로 두고, 해당 모드에 없는 항목(통합예약번호·예약번호)이 선택돼 있었다면 <code>전체</code>로 복귀시킵니다. 이때 입력해둔 키워드도 함께 초기화할지 여부를 정해두세요 — 남겨두면 조건과 맞지 않는 키워드로 조회되는 오해가 생깁니다.</p>
    <p><b>모드 전환 시 그리드는 초기화.</b> 이전 모드의 숫자가 남아 있으면 지금 보는 금액이 건별인지 합산인지 혼동됩니다. 금액 데이터에서는 그 오해가 바로 문의로 이어집니다.</p>
    <p><b>정산월은 선택한 기간 축의 월로 산출.</b> 기간이 날짜 자유 범위이므로 조회 기간이 월 경계를 걸치면 양쪽 달이 부분 집계로 잡힙니다(예: 9/1~9/17 조회 시 9월분은 17일까지만 포함). 월 마감 금액을 보려면 해당 월 전체를 조회해야 한다는 점을 안내 문구나 기본값으로 보완하는 것이 좋습니다.</p>
    <p><b>합산 모드는 집계 축과 금액 컬럼만 노출.</b> 건별 전용 컬럼(예약번호·투숙ID·거래일·정산상태 등)은 화면과 엑셀 모두에서 제외합니다. 금액 컬럼은 해당 거래가 없어도 <code>0</code>으로 채웁니다 — 금액 자리의 하이픈은 0원인지 집계 누락인지 구분할 수 없어 그대로 정산 불일치 문의가 됩니다.</p>
    <p><b>쿠폰 금액 컬럼과 거래구분의 이중 차감 주의.</b> 업체부담쿠폰은 거래구분(음수 거래 행)으로도 잡히고 전용 컬럼(업체부담쿠폰금액_1~3)으로도 노출됩니다. 정산예정금액을 계산할 때 두 경로를 모두 차감하면 금액이 두 번 빠집니다. 전용 컬럼은 표시용으로만 쓰고 차감은 한쪽에서만 하도록 산식을 고정해야 합니다. 샘플은 <code>정산예정금액 = 입금가 − 업체부담쿠폰(1~3) − NOL부스팅 − 프로모션수수료</code>로 계산했고, 야놀자부담쿠폰은 차감하지 않았습니다. 실제 산식 확인 후 반영이 필요합니다.</p>
    <p><b>쿠폰 _1/_2/_3의 의미 고정.</b> 이 접미사가 쿠폰 적용 순서인지, 쿠폰 종류 슬롯인지, 중복 적용 차수인지에 따라 합산 방식이 달라집니다. 슬롯이 고정 3개가 아니라면 건별 데이터에 4번째 쿠폰이 등장하는 순간 금액이 누락되므로, 슬롯 상한과 초과 시 처리 방식을 정의해 두어야 합니다.</p>
    <p><b>합산 모드에서 정산주기·거래구분·정산상태는 조건 영역에서 제거.</b> 집계는 항상 전체 기준으로 수행하며, 조건 요약에도 해당 항목을 표기하지 않습니다. 상태나 거래구분을 일부만 선택한 채 합산하면 어떤 범위의 금액인지 행에 표기되지 않아 부분 합계가 총액처럼 읽히는데, 조건 자체를 없애 그 경우를 원천 차단하는 방식입니다. 건별로 돌아오면 이전 선택값이 그대로 복원됩니다. DM톡 쿠폰만 조회·메타서치는 노출은 유지하되 비활성 처리합니다.</p>
    <p><b>대신 상태별 금액은 합산에서 확인할 수 없습니다.</b> "이번 달 지급 대상 금액"처럼 상태를 좁혀야 하는 질의는 건별 조회로 내려가야 합니다. 이 수요가 크면 정산상태를 집계 축에 넣고 필터를 다시 여는 방식으로 확장할 수 있습니다.</p>
    <p><b>수수료율은 합산 컬럼에서 제외.</b> 건별 수수료율의 단순 평균은 건수 편차 때문에 틀린 숫자가 나옵니다. 사업장 평균 수수료율이 필요해지면 수수료 합 ÷ 정산기준가 합으로 계산해 별도 컬럼으로 추가하세요.</p>
    <p><b>중복 합산 주의(서버).</b> 예약번호 하위에 투숙ID가 여러 개인 구조에서 조정액·쿠폰처럼 예약 단위로 부여되는 금액이 투숙ID 행마다 반복 저장돼 있으면 단순 <code>SUM</code>이 금액을 부풀립니다. 예약 단위 금액은 <code>DISTINCT 예약번호</code> 기준으로 분리 집계해야 합니다.</p>

<script>

            야놀자부담쿠폰_3, 업체부담쿠폰_3, NOL부스팅, 프로모션수수료, 정산예정금액,

    {key:["2026-08","모텔","20048214","가온스테이","10061911","가온스테이 강남","예약대행"],
     amt:[42120000,42120000,38104000,4016000,620000,940000,180000,260000,0,0,860000,420000,35624000,480000,260000,90000]},

     amt:[23260000,23260000,21042000,2218000,340000,520000,110000,140000,0,0,480000,260000,19642000,290000,180000,40000]},

     amt:[16880000,15420000,14903000,1977000,260000,680000,50000,180000,0,80000,980000,340000,12643000,410000,220000,80000]},
    {key:["2026-09","모텔","20063095","마루레저","10084213","마루모텔 부산역","선매입"],
     amt:[9270000,9270000,8530000,740000,0,0,0,0,0,0,0,95000,8435000,0,0,0]}
  ];

  /* ── 엘리먼트 ────────────────────────────────── */
  var $ = function(id){ return document.getElementById(id); };
  var mode = "detail";

  function fmt(n){
    if(typeof n !== "number") return n;
    return n.toLocaleString("ko-KR");
  }

  /* ── 모드 적용 ───────────────────────────────── */
  function applyMode(){
    var isSum = mode === "sum";

    Array.prototype.forEach.call($("seg").children, function(b){
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    });

    /* 검색 조건 항목만 조회 단위에 따라 구성 */
    renderCond();

    /* 합산 모드에서 미노출 — 값은 보존하고 전체 기준으로 집계 */
    ["cycleRow","txnRow","stateRow"].forEach(function(id){
      $(id).style.display = isSum ? "none" : "flex";
    });

    /* 합산 모드에서 비활성 — 값은 보존 */
    $("optRow").classList.toggle("disabled", isSum);
    Array.prototype.forEach.call($("optRow").querySelectorAll("input"), function(el){
      el.disabled = isSum;
    });

    $("xlsBtn").textContent = "엑셀 다운로드";

    /* 모드 전환 시 그리드 초기화 */
    $("gridWrap").style.display = "none";
    $("gridTop").style.display  = "none";
    $("emptyBox").style.display = "block";
    $("emptyMsg").textContent = isSum
      ? "조회 단위가 변경되었습니다. 검색하기를 눌러 합산 결과를 조회하세요."

    renderSummary();
  }

  /* 선택값은 가능한 한 보존, 해당 모드에 없는 항목이면 '전체'로 복귀 */
  function renderCond(){
    var sel = $("searchCond");
    var prev = sel.value;
    var list = COND[mode];
    sel.innerHTML = "";
    list.forEach(function(c){
      var o = document.createElement("option");
      o.textContent = c;
      sel.appendChild(o);
    });
    sel.value = list.indexOf(prev) > -1 ? prev : "전체";
  }

  function renderSummary(){
    var isSum = mode === "sum";
    var base = $("periodType").value;
    var parts = [
      "조회 단위: " + (isSum ? "사업장 합산" : "건별 조회"),
      "카테고리: 모텔",

      base + ": 2026-09-01 ~ 2026-09-17"
    ];
    if(!isSum){
      parts.push("정산주기: 일정산, 주정산, 월정산A, 월정산B, 지정일미확정");

    parts.push("검색조건: " + $("searchCond").value + ($("searchKw").value ? " / " + $("searchKw").value : ""));
    parts.push("DM톡 쿠폰만 조회: " + (isSum ? "미적용" : "N"));
    parts.push("메타서치: " + (isSum ? "미적용" : "N"));
    if(!isSum){
      parts.push("정산상태: 정산대기, 자동보류, 수동보류, 지급요청대기, 지급요청중, 정산완료");
    }
    $("summaryTxt").innerHTML = "✓ " + parts.join(" &nbsp;|&nbsp; ");
  }

  /* ── 렌더 ────────────────────────────────────── */
  function renderDetail(){
    var thead = $("thead"), tbody = $("tbody");
    thead.innerHTML = ""; tbody.innerHTML = "";

      var th = document.createElement("th");
      th.textContent = c;
      if(DETAIL_NUM.indexOf(c) > -1) th.className = "num";
      thead.appendChild(th);
    });
    detailRows.forEach(function(r){

      r.forEach(function(v,i){

        var col = DETAIL_COLS[i];
        td.textContent = fmt(v);
        if(DETAIL_NUM.indexOf(col) > -1) td.className = "num";
        if(v === "-") td.className = "dash";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    $("rowCnt").textContent = detailRows.length;
  }

  function renderSum(){
    var thead = $("thead"), tbody = $("tbody");
    thead.innerHTML = ""; tbody.innerHTML = "";

    function th(label, cls){
      var el = document.createElement("th");
      el.textContent = label;
      if(cls) el.className = cls;
      thead.appendChild(el);
    }
    SUM_KEY.forEach(function(c){ th(c, "key"); });
    SUM_AMT.forEach(function(c){ th(c, "pivot num"); });

    sumRows.forEach(function(r){
      var tr = document.createElement("tr");
      r.key.forEach(function(v){
        var td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
      });
      r.amt.forEach(function(v){
        var td = document.createElement("td");
        td.className = "num";
        td.textContent = fmt(v);          /* 금액은 0도 숫자로 표기 */
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    $("rowCnt").textContent = sumRows.length;
  }

  function search(){
    $("emptyBox").style.display = "none";
    $("gridTop").style.display  = "flex";
    $("gridWrap").style.display = "block";
    if(mode === "sum") renderSum(); else renderDetail();

  /* ── 이벤트 ──────────────────────────────────── */

    var b = e.target.closest("button");

    mode = b.dataset.mode;
    applyMode();

  $("searchCond").addEventListener("change", renderSummary);

      : "건별 내역 엑셀을 다운로드합니다.");
  });

      document.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("on"); });

    });
  });

  applyMode();
  search();
})();
